<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Component | Electronics Inventory</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        header { background: #172554; color: white; padding: 20px 30px; }
        nav a { color: white; margin-right: 18px; text-decoration: none; }
        main { padding: 30px; }
        form.entry { background: white; padding: 24px; border-radius: 10px; max-width: 450px; }
        label { display: block; margin-top: 15px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 20px; padding: 10px 16px; cursor: pointer; }
    </style>
</head>
<body>
<header>
    <h1>Electronics Store Inventory</h1>
    <nav>
        <a href="/">Dashboard</a><a href="/inventory">Inventory</a>
        <a href="/add">Add Component</a><a href="/report">Reports</a>
        <form action="/logout" method="post" style="display:inline">
            <button type="submit">Logout</button>
        </form>
    </nav>
</header>
<main>
    <h2>Add Component</h2>
    <form class="entry" method="post" action="/add">
        <label for="component_name">Component Name</label>
        <input id="component_name" name="component_name" required maxlength="150">

        <label for="category">Category</label>
        <input id="category" name="category" required maxlength="100">

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="0" required>

        <label for="price">Price (₹)</label>
        <input id="price" name="price" type="number" min="0" step="0.01" required>

        <button type="submit">Save Component</button>
        <a href="/inventory">Cancel</a>
    </form>
</main>
</body>
</html>
