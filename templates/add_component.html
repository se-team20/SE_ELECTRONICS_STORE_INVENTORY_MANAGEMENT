
{% extends "base.html" %}

{% block title %}Add Component | Electronics Inventory{% endblock %}

{% block content %}
<h2>Add a Component</h2>

<div class="card" style="max-width:650px;">
    <p>Enter the details of the new electronics component.</p>

    <form action="{{ url_for('add_component') }}" method="POST">
        <div>
            <label for="component_name">Component Name *</label><br>
            <input
                type="text"
                id="component_name"
                name="component_name"
                maxlength="150"
                required
                style="width:100%;"
            >
        </div>

        <div>
            <label for="category">Category *</label><br>
            <input
                type="text"
                id="category"
                name="category"
                maxlength="100"
                required
                style="width:100%;"
            >
        </div>

        <div>
            <label for="quantity">Quantity *</label><br>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="0"
                step="1"
                required
                style="width:100%;"
            >
        </div>

        <div>
            <label for="price">Price per Unit *</label><br>
            <input
                type="number"
                id="price"
                name="price"
                min="0"
                step="0.01"
                required
                style="width:100%;"
            >
        </div>

        <p>* Required fields</p>

        <button type="submit">Save Component</button>
        <a href="{{ url_for('inventory') }}">Cancel</a>
    </form>
</div>
{% endblock %}
